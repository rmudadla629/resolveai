name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests (no model or API key required)
        run: python -m unittest discover -s tests -v
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application image
        run: docker build -t resolveai-ci .
      - name: Run regression tests inside image
        run: docker run --rm resolveai-ci python -m unittest discover -s tests -v
      - name: Start application without model dependency
        run: docker run -d --name resolveai-smoke -p 127.0.0.1:18000:8000 resolveai-ci
      - name: Check HTTP health
        run: |
          python - <<'PY'
          import time
          import urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18000/health', timeout=2) as response:
                      assert response.status == 200
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Container did not become healthy')
          PY
      - name: Container logs
        if: always()
        run: docker logs resolveai-smoke
      - name: Clean up smoke container
        if: always()
        run: docker rm -f resolveai-smoke
